name: Build Azure Function (TypeScript)

on:
  push:
    branches:
      - branch-testing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsc --noEmit   # pastikan semua TypeScript bisa di-compile
